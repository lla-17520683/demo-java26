name: Trigger auto deployment for demo-java26

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/demo-java26-AutoDeployTrigger-bb640c1b-b842-40b9-bc31-ad9d92cc1a73.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEMOJAVA26_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMOJAVA26_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMOJAVA26_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.DEMOJAVA26_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEMOJAVA26_REGISTRY_PASSWORD }}
          containerAppName: demo-java26
          resourceGroup: lla
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


